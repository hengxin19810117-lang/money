spring:
  application:
    name: finance-butler

  datasource:
    url: jdbc:mysql://localhost:3306/money_java?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

jwt:
  secret: finance_butler_jwt_secret_key_2024_very_long_and_secure
  expiration: 604800000  # 7 days in milliseconds

logging:
  level:
    com.finance: INFO
    org.springframework.security: INFO
